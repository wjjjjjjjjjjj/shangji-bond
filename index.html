<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff2442"><title>笔记检索 · 红笺数据</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="./index.html"><i class="brandmark"><b></b></i><strong>红笺数据</strong></a><div class="platform">小红书信息检索平台</div></header>
<aside><div class="nav-label">工作空间</div><div class="group"><i data-icon="layers"></i>笔记查询<i data-icon="down"></i></div><div class="active-nav"><i data-icon="search"></i>笔记检索</div><div class="side-foot"><span class="mini-brand">笺</span><div><b>红笺工作台</b><small>小红书数据空间</small></div></div></aside>
<main><div class="crumb">工作空间 <em>/</em> 笔记查询 <em>/</em> <b>笔记检索</b></div>
<section class="search-card"><div class="section-intro"><div class="hero-icon" data-icon="scan"></div><div><h1>笔记检索</h1><p>整点更新关键词索引，按笔记发布时间筛选。</p></div><div class="hero-art" aria-hidden="true"><div class="sheet back"></div><div class="sheet front"><i></i><i></i><i></i></div><div class="magnify"></div><b>✦</b></div></div>
<div class="filter-line"><b>查询来源</b><div class="options" id="sources"></div></div><form id="searchform"><div class="input-wrap"><i data-icon="search"></i><input id="query" aria-label="笔记关键词" maxlength="80" placeholder="输入关键词，检索小红书笔记" value="棉花娃娃" required><button type="button" id="clear" aria-label="清空关键词">×</button></div><button class="primary" id="search" type="submit"><i data-icon="search"></i>检索笔记</button></form>
<div class="filter-line"><b>发布时间</b><div class="options" id="times"></div></div><div class="filter-line last"><b>笔记类型</b><div class="options" id="types"></div></div></section>
<div class="section-title"><h2>数据概览</h2><span id="scope"></span></div><div class="stats" id="stats"></div>
<section class="results"><div class="results-head"><div class="result-title"><h2>笔记列表</h2><span id="count"></span></div><div class="actions"><select id="sort" aria-label="排序"><option value="likes">点赞优先</option><option value="favorites">收藏优先</option><option value="comments">评论优先</option><option value="shares">分享优先</option><option value="date">最新发布</option></select><button id="export"><i data-icon="download"></i>导出</button></div></div>
<div class="result-meta" id="meta"></div><div id="message" role="status" aria-live="polite"></div>
<div class="table-wrap"><table><thead><tr><th>笔记信息</th><th>发布时间（北京时间）</th><th>点赞</th><th>收藏</th><th>评论</th><th>分享</th><th>总互动</th><th>原文</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="empty" hidden></div><div class="pages"><span id="pagination"></span><div><button id="prev" aria-label="上一页">‹</button><b id="page"></b><button id="next" aria-label="下一页">›</button></div></div></section></main>
<dialog id="dialog"><form method="dialog"><button class="close" aria-label="关闭">×</button></form><div id="dialog-content"></div></dialog>
<script src="search-endpoint.js"></script><script src="sample.js"></script><script src="notes-public.js?v=verified-dates-1"></script></body></html>
