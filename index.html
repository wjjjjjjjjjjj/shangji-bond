<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>档案商机 — 全国档案采购公告与意向</title>
  <meta name="description" content="集中查看档案信息化采购公告、采购意向和采购需求，按地区与采购方式筛选，追溯公告原文和公开采购文件。">
  <meta name="theme-color" content="#123e3c"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="./" aria-label="档案商机首页"><span class="brand-mark" aria-hidden="true">▤</span><span>档案商机<span class="brand-sub">采购公告与意向</span></span></a><span class="public-label"><span aria-hidden="true">◎</span> 公开浏览 · 无需登录</span></header>
  <main>
    <section class="intro"><div><p class="eyebrow">ARCHIVE PROCUREMENT</p><h1>发现下一次合作机会</h1><p class="intro-copy">汇集档案信息化相关采购信息，让每一条线索有据可查。</p></div><div class="update"><span>最近收录的日报</span><strong id="updated">正在读取</strong><span>北京时间 · 采集范围内公开信息</span></div></section>
    <form id="search-form" class="search-bar" role="search"><span aria-hidden="true" class="search-icon">⌕</span><label class="sr-only" for="query">搜索项目名称、采购人或关键词</label><input id="query" type="search" placeholder="搜索项目名称、采购人或关键词，例如：电子档案" autocomplete="off"><button type="submit" class="primary">搜索商机</button></form>
    <div class="workspace">
      <aside class="sidebar" aria-label="筛选条件"><div class="filter-heading"><h2>筛选商机</h2><button id="reset" class="text-button" type="button">重置</button></div>
        <label for="province">项目地区</label><select id="province"><option value="">全国地区</option></select>
        <label for="method">采购方式</label><select id="method"><option value="">全部方式</option></select>
        <label for="budget">预算金额</label><select id="budget"><option value="">全部金额</option><option value="under50">50 万元以下</option><option value="50to100">50–100 万元</option><option value="100to500">100–500 万元</option><option value="over500">500 万元及以上</option><option value="unknown">金额未识别</option></select>
        <label for="period">公告发布时间</label><select id="period"><option value="">全部时间</option><option value="7">近 7 天</option><option value="30">近 30 天</option><option value="90">近 90 天</option></select>
        <label class="check"><input type="checkbox" id="high">仅看高相关信息</label><label class="check"><input type="checkbox" id="hide-expired">隐藏已过截止日期</label>
        <div class="source-note"><span class="note-icon" aria-hidden="true">▥</span><h3>从线索，到原文</h3><p>每条信息保留公开来源。预算、时间及更正内容，请以采购方最新公告为准。</p><span id="coverage">正在读取日报记录</span></div>
      </aside>
      <section class="results" aria-label="商机结果">
        <div class="tabs" role="group" aria-label="公告分类"><button class="tab active" data-type="" aria-pressed="true">全部商机 <span id="all-count">—</span></button><button class="tab" data-type="采购公告" aria-pressed="false">采购公告</button><button class="tab" data-type="采购意向" aria-pressed="false">采购意向</button><button class="tab" data-type="采购需求" aria-pressed="false">采购需求</button><button class="tab" data-type="更正公告" aria-pressed="false">更正公告</button></div>
        <div class="result-bar"><p id="result-count" role="status" aria-live="polite">正在加载采购信息…</p><label class="sort-label" for="sort">排序<select id="sort"><option value="newest">发布时间：最新优先</option><option value="budget">预算金额：从高到低</option><option value="deadline">截止日期：最近优先</option></select></label></div>
        <div class="data-notice" id="freshness" hidden></div>
        <div id="cards" class="cards" aria-busy="true"></div>
        <div id="empty" class="empty" hidden><span aria-hidden="true">⌕</span><h2>暂未找到匹配的商机</h2><p>试试其他关键词，或放宽筛选条件。</p><button id="clear-empty" class="secondary">清除全部筛选</button></div>
        <div id="error" class="empty" hidden><h2>采购信息暂时无法加载</h2><p>请稍后重试，当前页面未显示完整数据。</p><button id="retry" class="primary">重新加载</button></div>
        <div class="pagination" id="pagination" hidden><button id="prev" class="secondary">上一页</button><span id="page-info"></span><button id="next" class="secondary">下一页</button></div>
      </section>
    </div>
  </main>
  <footer><span class="footer-brand">档案商机</span><span>公开采购信息索引 · 不代表采购方承诺或仍在受理投标</span><span>公告原文为准</span></footer>
  <dialog id="detail" aria-labelledby="detail-title"><div class="dialog-top"><span>商机详情</span><button id="close-detail" aria-label="关闭详情">×</button></div><div id="detail-body"></div></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
